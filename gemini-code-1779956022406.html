<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lazyedit. - 极简艺术海报生成器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* 简单处理一下过渡动画 */
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen bg-[#F6F6F4] text-[#1A1A1A] font-sans antialiased flex flex-col selection:bg-black selection:text-white">

    <header class="w-full px-8 py-5 flex justify-between items-center bg-white/60 backdrop-blur-md border-b border-[#EAEAE6] sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <span class="text-xl font-bold tracking-tight lowercase">lazyedit<span class="text-[#FF4500] font-light">.</span></span>
            <span class="text-xs px-2 py-0.5 bg-[#F0F0EC] text-[#7A7A75] rounded-full">v1.0 alpha</span>
        </div>
        
        <div class="flex items-center space-x-4">
            <button class="p-2 text-[#7A7A75] hover:text-[#1A1A1A] hover:bg-[#F0F0EC] rounded-full transition-all duration-200">
                <i data-lucide="sun" class="w-5 h-5"></i>
            </button>
            <button class="flex items-center space-x-2 px-5 py-2.5 bg-[#1A1A1A] hover:bg-[#333333] text-white text-sm font-medium rounded-full shadow-sm hover:shadow transition-all duration-200 group">
                <span>导出艺术海报</span>
                <i data-lucide="download" class="w-4 h-4 transition-transform group-hover:translate-y-0.5"></i>
            </button>
        </div>
    </header>

    <main class="flex-1 flex flex-col lg:flex-row p-6 lg:p-8 gap-8 max-w-[1600px] w-full mx-auto">
        
        <div class="flex-1 flex items-center justify-center bg-white rounded-3xl border border-[#EAEAE6] shadow-sm p-8 min-h-[500px] lg:min-h-0 relative overflow-hidden group">
            
            <div id="canvasContainer" class="relative w-full max-w-[420px] aspect-[3/4] bg-[#EAEAE6] rounded-2xl shadow-xl overflow-hidden border border-[#D4D4D0] transition-transform duration-300 group-hover:scale-[1.01]">
              
                <div class="absolute inset-0 z-10 bg-gradient-to-tr from-[#D4E2D5] to-[#E9CCD2] flex items-end justify-center">
                    <span class="absolute top-4 left-4 text-[10px] uppercase tracking-widest text-black/30 font-mono">z-index: 10 / background</span>
                    <div class="w-56 h-80 bg-[#C5D3C6] rounded-t-full mb-0 opacity-40"></div> 
                </div>

                <div class="absolute inset-0 z-20 pointer-events-none flex flex-col items-center justify-center p-6">
                    <span class="absolute top-8 left-4 text-[10px] uppercase tracking-widest text-black/30 font-mono">z-index: 20 / elements</span>
                    <h1 class="text-4xl lg:text-5xl font-black text-white text-center tracking-tighter leading-none select-none uppercase transform -rotate-6 filter drop-shadow-sm">
                        SILENT<br />
                        <span class="text-transparent" style="-webkit-text-stroke: 1px white;">REFLECTION</span>
                    </h1>
                    <div class="absolute bottom-16 right-8 w-24 h-24 bg-[#FF4500]/20 backdrop-blur-sm rounded-full mix-blend-multiply"></div>
                </div>

                <div class="absolute inset-0 z-30 pointer-events-none flex items-end justify-center">
                    <span class="absolute top-12 left-4 text-[10px] uppercase tracking-widest text-black/30 font-mono">z-index: 30 / subject</span>
                    
                    <div id="subjectAvatar" class="w-56 h-80 bg-[#C5D3C6] rounded-t-full mb-0 relative shadow-2xl transition-all duration-300 ring-[12px] ring-[#1A1A1A] ring-dashed">
                        <div id="subjectFilter" class="absolute inset-0 bg-gradient-to-b from-black/10 to-black/40 rounded-t-full mix-blend-color"></div>
                    </div>
                </div>

            </div>
        </div>

        <div class="w-full lg:w-[400px] bg-white rounded-3xl border border-[#EAEAE6] shadow-sm p-6 flex flex-col justify-between">
          
            <div>
                <div class="flex items-center justify-between mb-6 pb-4 border-b border-[#F6F6F4]">
                    <div>
                        <h2 class="text-base font-semibold">艺术编辑面板</h2>
                        <p class="text-xs text-[#7A7A75]">自由编排人像与创意的层级</p>
                    </div>
                    <i data-lucide="sparkles" class="w-5 h-5 text-[#7A7A75]"></i>
                </div>

                <div class="grid grid-cols-4 bg-[#F6F6F4] p-1 rounded-full mb-6">
                    <button onclick="switchTab('upload')" id="btn-upload" class="tab-btn py-2 text-xs font-medium rounded-full capitalize transition-all duration-200 bg-white text-[#1A1A1A] shadow-sm">主图</button>
                    <button onclick="switchTab('layers')" id="btn-layers" class="tab-btn py-2 text-xs font-medium rounded-full capitalize transition-all duration-200 text-[#7A7A75] hover:text-[#1A1A1A]">加插</button>
                    <button onclick="switchTab('stroke')" id="btn-stroke" class="tab-btn py-2 text-xs font-medium rounded-full capitalize transition-all duration-200 text-[#7A7A75] hover:text-[#1A1A1A]">描边</button>
                    <button onclick="switchTab('filter')" id="btn-filter" class="tab-btn py-2 text-xs font-medium rounded-full capitalize transition-all duration-200 text-[#7A7A75] hover:text-[#1A1A1A]">滤镜</button>
                </div>

                <div class="space-y-6 min-h-[280px]">
                  
                    <div id="panel-upload" class="tab-panel active space-y-4 animate-fade-in">
                        <span class="text-xs font-medium text-[#7A7A75] block">当前画布底图</span>
                        <div class="p-4 bg-[#F6F6F4] rounded-2xl flex items-center justify-between border border-[#EAEAE6]">
                            <div class="flex items-center space-x-3">
                                <div class="w-12 h-12 bg-[#EAEAE6] rounded-xl overflow-hidden flex items-center justify-center text-xs font-mono">IMG</div>
                                <div>
                                    <p class="text-xs font-medium truncate w-40">portrait_artwork.png</p>
                                    <p class="text-[10px] text-[#7A7A75]">2.4 MB · 已智能分层</p>
                                </div>
                            </div>
                            <button class="text-xs px-3 py-1.5 bg-white text-red-500 border border-[#EAEAE6] rounded-full hover:bg-red-50 transition-all">移除</button>
                        </div>
                    </div>

                    <div id="panel-layers" class="tab-panel space-y-4 animate-fade-in">
                        <span class="text-xs font-medium text-[#7A7A75] block">在人像背后插入元素</span>
                        <div class="grid grid-cols-2 gap-3">
                            <button class="flex items-center justify-center space-x-2 p-4 bg-white border border-[#CDCDC9] hover:border-[#1A1A1A] rounded-2xl transition-all group">
                                <i data-lucide="type" class="w-4 h-4 text-[#7A7A75] group-hover:text-[#1A1A1A]"></i>
                                <span class="text-xs font-medium">置入排版文字</span>
                            </button>
                            <button class="flex items-center justify-center space-x-2 p-4 bg-white border border-[#CDCDC9] hover:border-[#1A1A1A] rounded-2xl transition-all group">
                                <i data-lucide="square" class="w-4 h-4 text-[#7A7A75] group-hover:text-[#1A1A1A]"></i>
                                <span class="text-xs font-medium">置入几何形状</span>
                            </button>
                        </div>
                    </div>

                    <div id="panel-stroke" class="tab-panel space-y-5 animate-fade-in">
                        <div>
                            <span class="text-xs font-medium text-[#7A7A75] block mb-3">边缘检测描边样式</span>
                            <div class="grid grid-cols-2 gap-2">
                                <button onclick="changeStroke('none')" id="s-none" class="stroke-btn p-3 text-xs font-medium rounded-xl border text-center transition-all border-[#EAEAE6] bg-white">无描边</button>
                                <button onclick="changeStroke('solid')" id="s-solid" class="stroke-btn p-3 text-xs font-medium rounded-xl border text-center transition-all border-[#EAEAE6] bg-white">纯色块</button>
                                <button onclick="changeStroke('dots')" id="s-dots" class="stroke-btn p-3 text-xs font-medium rounded-xl border text-center transition-all border-[#1A1A1A] bg-[#1A1A1A] text-white">复古波点</button>
                                <button onclick="changeStroke('stripes')" id="s-stripes" class="stroke-btn p-3 text-xs font-medium rounded-xl border text-center transition-all border-[#EAEAE6] bg-white">波普条纹</button>
                            </div>
                        </div>

                        <div id="widthSliderContainer" class="space-y-2">
                            <div class="flex justify-between text-xs text-[#7A7A75]">
                                <span>描边粗细 (Contour Width)</span>
                                <span id="strokeWidthVal" class="font-mono text-[#1A1A1A]">12px</span>
                            </div>
                            <input id="widthSlider" type="range" min="4" max="32" value="12" oninput="updateStrokeWidth(this.value)" class="w-full h-1 bg-[#F6F6F4] rounded-full appearance-none cursor-pointer accent-[#1A1A1A]" />
                        </div>
                    </div>

                    <div id="panel-filter" class="tab-panel space-y-4 animate-fade-in">
                        <span class="text-xs font-medium text-[#7A7A75] block">独立人像图层滤镜（背景不受影响）</span>
                        <div class="space-y-2">
                            <label onclick="changeFilter('normal')" class="flex items-center justify-between p-3 bg-[#F6F6F4] hover:bg-[#F0F0EC] rounded-xl cursor-pointer transition-all">
                                <span class="text-xs font-medium">原图色调</span>
                                <input type="radio" name="filter" checked class="w-4 h-4 accent-[#1A1A1A]">
                            </label>
                            <label onclick="changeFilter('bw')" class="flex items-center justify-between p-3 bg-[#F6F6F4] hover:bg-[#F0F0EC] rounded-xl cursor-pointer transition-all">
                                <span class="text-xs font-medium">高级黑白 (Monochrome)</span>
                                <input type="radio" name="filter" class="w-4 h-4 accent-[#1A1A1A]">
                            </label>
                            <label onclick="changeFilter('pop')" class="flex items-center justify-between p-3 bg-[#F6F6F4] hover:bg-[#F0F0EC] rounded-xl cursor-pointer transition-all">
                                <span class="text-xs font-medium">酸性荧光 (Acid Pop)</span>
                                <input type="radio" name="filter" class="w-4 h-4 accent-[#1A1A1A]">
                            </label>
                        </div>
                    </div>

                </div>
            </div>

            <div class="mt-6 pt-4 border-t border-[#F6F6F4] flex justify-between items-center text-[11px] text-[#9A9A95]">
                <span>设计语言：极简浅色 / lazyedit</span>
                <button class="hover:text-[#1A1A1A] underline underline-offset-2">重置所有画布</button>
            </div>

        </div>
    </main>

    <script>
        // 初始化 Lucide 图标
        lucide.createIcons();

        // 标签页切换逻辑
        function switchTab(tabId) {
            // 隐藏所有面板
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            // 取消所有按钮的激活状态
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('bg-white', 'text-[#1A1A1A]', 'shadow-sm');
                b.classList.add('text-[#7A7A75]', 'hover:text-[#1A1A1A]');
            });

            // 激活当前面板和按钮
            document.getElementById('panel-' + tabId).classList.add('active');
            const activeBtn = document.getElementById('btn-' + tabId);
            activeBtn.classList.add('bg-white', 'text-[#1A1A1A]', 'shadow-sm');
            activeBtn.classList.remove('text-[#7A7A75]', 'hover:text-[#1A1A1A]');
        }

        // 描边控制逻辑
        const avatar = document.getElementById('subjectAvatar');
        
        function changeStroke(type) {
            // 重置描边相关的样式类
            avatar.className = "w-56 h-80 bg-[#C5D3C6] rounded-t-full mb-0 relative shadow-2xl transition-all duration-300";
            
            // 恢复所有按钮样式
            document.querySelectorAll('.stroke-btn').forEach(b => {
                b.classList.remove('border-[#1A1A1A]', 'bg-[#1A1A1A]', 'text-white');
                b.classList.add('border-[#EAEAE6]', 'bg-white', 'text-[#1A1A1A]');
            });
            // 激活选中按钮样式
            document.getElementById('s-' + type).classList.add('border-[#1A1A1A]', 'bg-[#1A1A1A]', 'text-white');

            const sliderContainer = document.getElementById('widthSliderContainer');
            if (type === 'none') {
                sliderContainer.style.opacity = '0.3';
                sliderContainer.style.pointerEvents = 'none';
                return;
            } else {
                sliderContainer.style.opacity = '1';
                sliderContainer.style.pointerEvents = 'auto';
            }

            // 获取当前滑动条的粗细值
            const thick = document.getElementById('widthSlider').value + 'px';

            // 动态应用模拟样式
            if (type === 'solid') {
                avatar.style.border = `${thick} solid #FF4500`;
                avatar.style.outline = "none";
            } else if (type === 'dots') {
                avatar.style.border = `${thick} dashed #1A1A1A`;
                avatar.style.outline = "none";
            } else if (type === 'stripes') {
                avatar.style.border = "none";
                avatar.style.outline = `${thick} solid #1A1A1A`;
                avatar.style.outlineOffset = "4px";
            }
        }

        // 更新描边粗细值
        function updateStrokeWidth(val) {
            document.getElementById('strokeWidthVal').innerText = val + 'px';
            // 触发重新应用描边样式
            const activeStroke = document.querySelector('.stroke-btn.text-white').id.replace('s-', '');
            changeStroke(activeStroke);
        }

        // 滤镜切换逻辑 (模拟)
        function changeFilter(mode) {
            const filterLayer = document.getElementById('subjectFilter');
            if (mode === 'normal') {
                filterLayer.className = "absolute inset-0 bg-gradient-to-b from-black/10 to-black/40 rounded-t-full mix-blend-color";
            } else if (mode === 'bw') {
                filterLayer.className = "absolute inset-0 bg-gray-500 rounded-t-full mix-blend-color luminosity";
            } else if (mode === 'pop') {
                filterLayer.className = "absolute inset-0 bg-lime-400 rounded-t-full mix-blend-difference";
            }
        }

        // 首次打开初始化一次描边粗细的呈现
        updateStrokeWidth(12);
    </script>
</body>
</html>
